name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.3.0
        required: true
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Check tag matches versions
        run: |
          manifest=$(node -p "require('./extension/manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$manifest" ] || [ "$TAG" != "v$package" ]; then
            echo "::error::Tag $TAG must equal v$manifest (manifest) and v$package (package.json)."
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"
      - run: npm run package
      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/easypwd-$VERSION.zip" --clobber
      - name: Publish to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-cws.js "dist/easypwd-$VERSION.zip" ${{ github.event.release.prerelease && '--upload-only' || '' }}
